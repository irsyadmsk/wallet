name: Build Android APK

# Local builds on this dev machine are blocked by a Gradle daemon /
# loopback-connection restriction (likely antivirus/firewall) — this
# workflow builds the release APK on a clean Ubuntu runner instead, where
# that issue doesn't exist. Each build is published as the "APK terbaru"
# GitHub Release (a plain .apk on the repo's Releases page, easy to open
# from a phone) and also kept as a run artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Regenerate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      # Stable signing key from secrets, so each new APK installs over the
      # last one. Without the secrets the build is debug-signed and phones
      # must uninstall the old APK first.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 belum dipasang — APK ditandatangani kunci debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # run_number as versionCode so every build is a proper upgrade.
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: wallet-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Google Play only accepts an Android App Bundle. The Play build hides
      # the QRIS donation page (Play requires its own billing for tips).
      - name: Build release App Bundle (Play Store)
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=WALLET_CHANNEL=play

      - name: Rename APK & AAB
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk wallet.apk
          cp build/app/outputs/bundle/release/app-release.aab wallet.aab

      # One rolling release, always pointing at the newest main build, so
      # the download link never changes.
      - name: Publish "APK terbaru" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Build otomatis dari commit ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%d %H:%M') UTC).

          Cara pasang: unduh wallet.apk di HP Android, buka filenya, izinkan instal dari sumber ini, lalu Instal."
          git tag -f apk-latest "$GITHUB_SHA"
          git push -f origin refs/tags/apk-latest
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --title "APK terbaru" --notes "$notes" --latest
            gh release upload apk-latest wallet.apk wallet.aab --clobber
          else
            gh release create apk-latest wallet.apk wallet.aab --title "APK terbaru" --notes "$notes" --latest
          fi
