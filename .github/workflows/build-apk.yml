name: Build Android APK

# Release builds run here (signing key and Shorebird token live in repo
# secrets); local debug builds work too — see docs/BUILD_LOKAL.md. Each build is published as the "APK terbaru"
# GitHub Release (a plain .apk on the repo's Releases page, easy to open
# from a phone) and also kept as a run artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "shorebird.yaml"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Shorebird code push switches on once this secret (Console → Account
      # → API Keys) and shorebird.yaml (the app_id) are both in the repo.
      # Until then the plain Flutter build below runs, exactly as before.
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Tests, analysis and the Hive-adapter check already passed in the
      # pull request (ci.yml) for this exact code, so they aren't repeated
      # here — GitHub Actions minutes on a private repo are limited.

      # Gradle downloads (~1 GB of dependencies) are the slowest part of an
      # Android build; setup-gradle caches them (saved from main, reused by
      # pull requests) and stops the daemon so the cache can be written.
      - uses: gradle/actions/setup-gradle@v5

      # Stable signing key from secrets, so each new APK installs over the
      # last one. Missing signing material must stop the build before publishing.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing Wallet belum lengkap. Pulihkan kunci rilis yang sama; build/publikasi dihentikan."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # Decide what this push ships. (`skip`: a same-version push without
      # app changes, e.g. only workflows — nothing is built or published.)
      # Both modes use the explicit pubspec build number, so disabling
      # Shorebird cannot regress below the already uploaded Play versionCode.
      # - No Shorebird yet: a normal build.
      # - Shorebird, new `version:` in pubspec.yaml: a full *release* (new
      #   APK/AAB for GitHub and Play), with the same explicit build number.
      # - Shorebird, same version as the last release: a *patch* — the Dart
      #   changes reach installed apps on their next start, no store update.
      #   Native changes (android/, plugins) can't be patched: the job fails
      #   and asks for a version bump instead.
      - name: Plan
        id: plan
        run: |
          spec=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/\r$//')
          version=${spec%%+*}
          code=${spec#*+}
          if [ "$version" = "$spec" ] || ! [[ "$code" =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec.yaml harus memiliki versionName+versionCode eksplisit."
            exit 1
          fi
          if [ -n "$SHOREBIRD_TOKEN" ] && [ -f shorebird.yaml ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/release-v$version" >/dev/null; then
              mode=patch
              # A push that only touched workflows or docs has nothing to
              # send: skip instead of publishing an empty patch.
              before="${{ github.event.before }}"
              if [ "${{ github.event_name }}" = push ] && git fetch --no-tags --depth=1 origin "$before" 2>/dev/null                   && ! git diff --name-only "$before" HEAD | grep -qE '^(lib/|assets/|pubspec\.(yaml|lock)|shorebird\.yaml)'; then
                mode=skip
              fi
            else
              mode=release
            fi
          else
            mode=flutter
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "::notice::Mode $mode — versi $version (versionCode $code)"

      - uses: shorebirdtech/setup-shorebird@v1
        if: steps.plan.outputs.mode == 'release' || steps.plan.outputs.mode == 'patch'
        with:
          cache: true

      - name: Build release APK & App Bundle (Flutter)
        if: steps.plan.outputs.mode == 'flutter'
        run: |
          flutter build apk --release --build-number=${{ steps.plan.outputs.code }}
          flutter build appbundle --release --build-number=${{ steps.plan.outputs.code }}

      # One build for both stores: the app hides the donation page itself
      # when Play installed it (lib/app/distribution.dart).
      # --no-tree-shake-icons ships the whole Material icon font, so a patch
      # may use any icon (a tree-shaken font is an asset patches can't change).
      - name: Shorebird release (APK & App Bundle)
        if: steps.plan.outputs.mode == 'release'
        run: shorebird release android --artifact apk -- --build-number=${{ steps.plan.outputs.code }} --no-tree-shake-icons

      - name: Shorebird patch (update tanpa Play Store)
        if: steps.plan.outputs.mode == 'patch'
        run: |
          if ! shorebird patch android --release-version=${{ steps.plan.outputs.version }}+${{ steps.plan.outputs.code }} -- --no-tree-shake-icons; then
            echo "::error::Patch gagal. Kalau perubahan menyentuh kode native (android/, plugin, izin), naikkan 'version:' di pubspec.yaml agar menjadi rilis baru lewat Play Store."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.mode == 'flutter' || steps.plan.outputs.mode == 'release'
        with:
          name: wallet-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Rename APK & AAB
        if: steps.plan.outputs.mode == 'flutter' || steps.plan.outputs.mode == 'release'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk wallet.apk
          cp build/app/outputs/bundle/release/app-release.aab wallet.aab

      # One rolling release, always pointing at the newest full build, so
      # the download link never changes. Patches leave it alone: installed
      # and freshly downloaded apps both pick the patch up on start.
      - name: Publish "APK terbaru" release
        if: steps.plan.outputs.mode == 'flutter' || steps.plan.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          notes="Wallet $VERSION — build otomatis dari commit ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%d %H:%M') UTC).

          Cara pasang: unduh wallet.apk di HP Android, buka filenya, izinkan instal dari sumber ini, lalu Instal."
          git tag -f apk-latest "$GITHUB_SHA"
          git push -f origin refs/tags/apk-latest
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --title "APK terbaru" --notes "$notes" --latest
            gh release upload apk-latest wallet.apk wallet.aab --clobber
          else
            gh release create apk-latest wallet.apk wallet.aab --title "APK terbaru" --notes "$notes" --latest
          fi

      # Marks the version as released so later pushes patch it.
      - name: Tag Shorebird release
        if: steps.plan.outputs.mode == 'release'
        run: |
          git tag -f "release-v${{ steps.plan.outputs.version }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/release-v${{ steps.plan.outputs.version }}"
