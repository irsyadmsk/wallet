name: Build Android APK

# Local builds on this dev machine are blocked by a Gradle daemon /
# loopback-connection restriction (likely antivirus/firewall) — this
# workflow builds the release APK on a clean Ubuntu runner instead, where
# that issue doesn't exist. Each build is published as the "APK terbaru"
# GitHub Release (a plain .apk on the repo's Releases page, easy to open
# from a phone) and also kept as a run artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Shorebird code push switches on once this secret (Console → Account
      # → API Keys) and shorebird.yaml (the app_id) are both in the repo.
      # Until then the plain Flutter build below runs, exactly as before.
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Regenerate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      # Stable signing key from secrets, so each new APK installs over the
      # last one. Without the secrets the build is debug-signed and phones
      # must uninstall the old APK first.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 belum dipasang — APK ditandatangani kunci debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # Decide what this push ships.
      # - No Shorebird yet: a normal build, versionCode = run number.
      # - Shorebird, new `version:` in pubspec.yaml: a full *release* (new
      #   APK/AAB for GitHub and Play). versionCode is derived from the
      #   version (1.3.1 → 10301), so the release is found again later.
      # - Shorebird, same version as the last release: a *patch* — the Dart
      #   changes reach installed apps on their next start, no store update.
      #   Native changes (android/, plugins) can't be patched: the job fails
      #   and asks for a version bump instead.
      - name: Plan
        id: plan
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          IFS=. read -r maj min pat <<< "$version"
          if [ -n "$SHOREBIRD_TOKEN" ] && [ -f shorebird.yaml ]; then
            code=$((maj * 10000 + min * 100 + pat))
            if git ls-remote --exit-code --tags origin "refs/tags/release-v$version" >/dev/null; then
              mode=patch
            else
              mode=release
            fi
          else
            code=${{ github.run_number }}
            mode=flutter
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "::notice::Mode $mode — versi $version (versionCode $code)"

      - uses: shorebirdtech/setup-shorebird@v1
        if: steps.plan.outputs.mode != 'flutter'
        with:
          cache: true

      - name: Build release APK & App Bundle (Flutter)
        if: steps.plan.outputs.mode == 'flutter'
        run: |
          flutter build apk --release --build-number=${{ steps.plan.outputs.code }}
          flutter build appbundle --release --build-number=${{ steps.plan.outputs.code }}

      # One build for both stores: the app hides the donation page itself
      # when Play installed it (lib/app/distribution.dart).
      - name: Shorebird release (APK & App Bundle)
        if: steps.plan.outputs.mode == 'release'
        run: shorebird release android --artifact apk -- --build-number=${{ steps.plan.outputs.code }}

      - name: Shorebird patch (update tanpa Play Store)
        if: steps.plan.outputs.mode == 'patch'
        run: |
          if ! shorebird patch android --release-version=${{ steps.plan.outputs.version }}+${{ steps.plan.outputs.code }}; then
            echo "::error::Patch gagal. Kalau perubahan menyentuh kode native (android/, plugin, izin), naikkan 'version:' di pubspec.yaml agar menjadi rilis baru lewat Play Store."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.mode != 'patch'
        with:
          name: wallet-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Rename APK & AAB
        if: steps.plan.outputs.mode != 'patch'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk wallet.apk
          cp build/app/outputs/bundle/release/app-release.aab wallet.aab

      # One rolling release, always pointing at the newest full build, so
      # the download link never changes. Patches leave it alone: installed
      # and freshly downloaded apps both pick the patch up on start.
      - name: Publish "APK terbaru" release
        if: steps.plan.outputs.mode != 'patch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          notes="Wallet $VERSION — build otomatis dari commit ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%d %H:%M') UTC).

          Cara pasang: unduh wallet.apk di HP Android, buka filenya, izinkan instal dari sumber ini, lalu Instal."
          git tag -f apk-latest "$GITHUB_SHA"
          git push -f origin refs/tags/apk-latest
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --title "APK terbaru" --notes "$notes" --latest
            gh release upload apk-latest wallet.apk wallet.aab --clobber
          else
            gh release create apk-latest wallet.apk wallet.aab --title "APK terbaru" --notes "$notes" --latest
          fi

      # Marks the version as released so later pushes patch it.
      - name: Tag Shorebird release
        if: steps.plan.outputs.mode == 'release'
        run: |
          git tag -f "release-v${{ steps.plan.outputs.version }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/release-v${{ steps.plan.outputs.version }}"
