name: Build Android APK

# Local builds on this dev machine are blocked by a Gradle daemon /
# loopback-connection restriction (likely antivirus/firewall) — this
# workflow builds the release APK on a clean Ubuntu runner instead, where
# that issue doesn't exist. Download the result from the run's Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Regenerate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: wallet-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
