# Pemeriksaan setiap pull request, sebelum di-merge.
#
# Deploy Web dan Build APK hanya berjalan setelah perubahan masuk ke main,
# sehingga kegagalan baru ketahuan setelah terlambat (contoh: 24 September
# 2026, build APK merah tiga kali berturut-turut karena hive_generator tidak
# mengenal sintaks Dart baru, padahal tes dan build web hijau). Workflow ini
# menjalankan langkah-langkah yang sama lebih awal.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner and action versions are pinned on purpose: ubuntu-24.04 (not
# ubuntu-latest, which moves to Ubuntu 26 on 19 Oct 2026) and actions on
# Node 24. gradle/actions stays on v5: v6 moved its caching into a
# proprietary component with separate terms of use.
jobs:
  periksa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Langkah yang sama dengan Build APK: gagal bila ada sintaks yang tidak
      # dikenali generator, dan bila adapter yang ter-commit sudah basi.
      - name: Adapter Hive terbaru
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' || { echo "::error::Adapter .g.dart berubah setelah build_runner. Jalankan build_runner lalu commit hasilnya."; exit 1; }

      - name: Analisis
        run: flutter analyze --no-fatal-infos

      - name: Tes
        run: flutter test

      # A PR that keeps `version:` becomes a Shorebird *patch*, and patches
      # can't ship assets. Flutter bundles only the icons the code uses, so
      # a new Icons.x changes the icon font and the patch is rejected after
      # merge. Catch it here instead.
      - name: Ikon baru vs rilis Shorebird
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          git fetch --no-tags --depth=1 origin "refs/tags/release-v$version:refs/tags/release-v$version" 2>/dev/null || true
          if ! git rev-parse -q --verify "refs/tags/release-v$version" >/dev/null; then
            echo "Versi $version belum dirilis lewat Shorebird: pemeriksaan ikon dilewati."
            exit 0
          fi
          icons() { git grep -hoE 'Icons\.[a-zA-Z0-9_]+' "$1" -- lib | sort -u; }
          baru=$(comm -13 <(icons "release-v$version") <(icons HEAD))
          if [ -n "$baru" ]; then
            echo "::error::Ikon baru belum ada di rilis $version, jadi patch Shorebird akan ditolak: $(echo $baru). Pakai ikon yang sudah ada, atau naikkan 'version:' untuk rilis baru."
            exit 1
          fi

      # Build web hanya bila bagian khusus web berubah; kesalahan kode Dart
      # biasa sudah tertangkap oleh Analisis & Tes di atas.
      - name: Perlu build web?
        id: web
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}"
          if git diff --name-only FETCH_HEAD HEAD | grep -qE '^(web/|worker/|wrangler\.jsonc|pubspec\.(yaml|lock))'; then
            echo "perlu=true" >> "$GITHUB_OUTPUT"
          else
            echo "perlu=false" >> "$GITHUB_OUTPUT"
            echo "Build web dilewati: tidak ada perubahan di web/, worker/, atau pubspec." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build web
        if: steps.web.outputs.perlu == 'true'
        run: flutter build web --release

  # Kode native Android (mis. plugin NFC yang di-vendor di packages/) hanya
  # dikompilasi saat build APK. Tanpa job ini, kesalahan Java/Kotlin baru
  # ketahuan setelah merge, saat Build APK di main gagal.
  #
  # Hanya dibangun bila bagian native bisa terpengaruh (android/, plugin di
  # packages/, dependensi di pubspec). Perubahan Dart saja cukup diperiksa
  # job "periksa" — ini menghemat ±10 menit per pull request.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Perlu build Android?
        id: native
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}"
          if [ "${{ github.event_name }}" = workflow_dispatch ] || git diff --name-only FETCH_HEAD HEAD | grep -qE '^(android/|packages/|pubspec\.(yaml|lock)|\.github/workflows/)'; then
            echo "perlu=true" >> "$GITHUB_OUTPUT"
          else
            echo "perlu=false" >> "$GITHUB_OUTPUT"
            echo "Build Android dilewati: hanya kode Dart yang berubah." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.native.outputs.perlu == 'true'
        with:
          channel: stable
          cache: true

      # Gradle downloads (~1 GB of dependencies) are the slowest part of an
      # Android build; setup-gradle caches them (saved from main, reused by
      # pull requests) and stops the daemon so the cache can be written.
      - uses: gradle/actions/setup-gradle@v5
        if: steps.native.outputs.perlu == 'true'

      - run: flutter pub get
        if: steps.native.outputs.perlu == 'true'

      - name: Build APK (debug)
        if: steps.native.outputs.perlu == 'true'
        run: flutter build apk --debug
