org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# On the maintainer's Windows machine Java couldn't create its internal
# pipe ("Unable to establish loopback connection"): Java 17 makes a Unix
# domain socket in %TEMP%, which fails there. Fixed per user with the env
# var JAVA_TOOL_OPTIONS (see docs/BUILD_LOKAL.md). Building without a
# daemon is kept as before.
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
