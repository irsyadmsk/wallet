<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Wallet — pencatat keuangan pribadi oleh Muhammad Irsyad Sirojul Khoeir.">
  <meta name="author" content="Muhammad Irsyad Sirojul Khoeir">

  <!--
    Without this, mobile browsers fall back to a desktop-width viewport
    (~980px) and scale the whole page down to fit, which is what made icons
    and text look shifted/blurry on phones. `viewport-fit=cover` also turns
    on env(safe-area-inset-*) so the bottom nav can avoid the home-indicator
    area on iOS instead of sitting under it.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wallet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Wallet</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Lock the page itself so only Flutter's own scroll views move. Without
      this, mobile Safari/Chrome rubber-band the whole HTML page on
      overscroll, which drags fixed UI (the bottom nav, floating buttons)
      along with it — the "naik" jump the app showed on real phones.
    */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0b1120;
    }

    /* Flutter injects its canvas/glass-pane directly into <body>; keep it
       pinned to the visual viewport so it resizes smoothly as the mobile
       browser's toolbar shows/hides instead of jumping. */
    flt-glass-pane, flutter-view {
      position: fixed !important;
      inset: 0 !important;
      height: 100dvh !important;
      width: 100vw !important;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
